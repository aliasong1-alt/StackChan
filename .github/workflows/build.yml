name: Build StackChan Firmware

on:
  push:
    branches: [dao]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4

    steps:
      - uses: actions/checkout@v4

      - name: Fetch external dependencies
        working-directory: firmware
        run: python fetch_repos.py

      - name: Inject WiFi credentials
        if: env.WIFI_SSID != ''
        working-directory: firmware
        run: |
          echo "CONFIG_STACKCHAN_DEFAULT_WIFI_SSID=\"$WIFI_SSID\"" >> sdkconfig.defaults
          echo "CONFIG_STACKCHAN_DEFAULT_WIFI_PASSWORD=\"$WIFI_PASSWORD\"" >> sdkconfig.defaults
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}

      - name: Build firmware
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Create merged firmware binary
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          python -m esptool --chip esp32s3 merge_bin \
            -o stackchan-dao.bin \
            --flash_mode dio \
            --flash_size 16MB \
            --flash_freq 80m \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0xd000 build/ota_data_initial.bin \
            0x20000 build/stack-chan.bin \
            0xa00000 build/generated_assets.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-dao-firmware
          path: |
            firmware/stackchan-dao.bin
